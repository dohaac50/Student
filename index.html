<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="home py-5">
      <div class="container">
        <!-- Form Card -->
        <div class="form-card">
          <h1 class="text-center mb-5">Student Management System</h1>

          <div class="row g-3">
            <div class="col-md-6">
              <input
                type="text"
                id="student-id"
                class="form-control"
                placeholder="Enter Your ID"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="student-first"
                class="form-control"
                placeholder="Enter Your First Name"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="student-last"
                class="form-control"
                placeholder="Enter Your Last Name"
              />
            </div>

            <div class="col-md-6">
              <input
                type="number"
                id="student-grade"
                class="form-control"
                placeholder="Enter Your Grade"
              />
            </div>

            <div class="col-md-6">
              <input
                type="number"
                id="student-subject"
                class="form-control"
                placeholder="Enter Number Of Subjects"
              />
            </div>

            <div class="col-12 text-center mt-3">
              <button
                type="button"
                id="submit-Btn"
                class="btn btn-primary px-5"
              >
                Submit
              </button>
            </div>
          </div>
        </div>
        <!-- End Form Card -->

        <h2 class="mt-5 mb-3">Statistics</h2>

        <div class="stats">
          <div class="stat-card total-card">
            <h6>Total Students</h6>
            <h2 id="total-students">0</h2>
          </div>

          <div class="stat-card passed-card">
            <h6>Passed Students</h6>
            <h2 id="passed-students">0</h2>
          </div>

          <div class="stat-card failed-card">
            <h6>Failed Students</h6>
            <h2 id="failed-students">0</h2>
          </div>
        </div>

        <h2 class="mt-5 mb-3">Students</h2>
        <!-- search -->
        <input
          type="text"
          id="search-input"
          class="form-control mb-3"
          placeholder="Search By First Name"
        />

        <div class="table-responsive">
          <table
            class="table table-striped table-bordered text-center align-middle"
          >
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Grade</th>
                <th>Number Of Subjects</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/all.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
